# Registry of every figure referenced (via \includegraphics) from
# main.tex and its \input sections in the paper repo (../gw_research_paper).
#
# The paper's source lives only in that Overleaf-linked sibling repo (canonical as of 2026-10-19);
# this experiment keeps no copy. collect_figures.py copies each `source` into that repo's root,
# next to the .tex sources, the way arXiv's flat submission tree requires.
#
# `source` is relative to the experiment root (experiments/phic_psi_poc-redo/).
# `dest_name` is the flat filename \includegraphics actually calls in the .tex
# sources -- collect_figures.py copies `source` to ../gw_research_paper/<dest_name>.
#
# Regenerate by hand when a figure is added, renamed, or removed; keep this
# file and the \includegraphics calls in sync in the same change.

figures:
    -   id: sweep_ratio_vs_iota
        label: fig:sweep
        referenced_in:
            - 003_prereq_study.tex
        dest_name: sweep_1_1_ratio_vs_iota.png
        source: sweep_1_1_ratio_vs_iota.png
        formats: [ png, pdf ]

    -   id: scatter_mchirp
        label: fig:controls
        referenced_in:
            - 005_diagnostics.tex
        dest_name: scatter_mchirp_20261019_125442.png
        source: analysis_output/scatter_mchirp_20261019_125442.png
        formats: [ png, pdf ]
