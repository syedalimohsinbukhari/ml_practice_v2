# Registry of every figure referenced (via \includegraphics) from
# paper/paper1/main.tex and its \input sections.
#
# paper/paper1/ is the Overleaf-linked nested git repo holding the actual arXiv
# submission source; this registry and collect_figures.py stay in paper/ (the
# main repo) and only the copied figures land in paper1/.
#
# `source` is relative to the experiment root (experiments/phic_psi_poc/).
# `dest_name` is the flat filename \includegraphics actually calls in the .tex
# sources -- collect_figures.py copies `source` to paper/paper1/<dest_name>.
#
# Regenerate by hand when a figure is added, renamed, or removed; keep this
# file and the \includegraphics calls in sync in the same change.

figures:
    -   id: sweep_ratio_vs_iota
        label: fig:phicpsi:sweep
        referenced_in:
            - main.tex
        dest_name: sweep_1_1_ratio_vs_iota.png
        source: sweep_1_1_ratio_vs_iota.png
        formats: [ png ]

    -   id: true_label_distributions
        label: fig:phicpsi:labels
        referenced_in:
            - the-diagnostic-arc-making-the-measurement-trustworthy.tex
        dest_name: true_label_distributions.png
        source: diagnostic_output/true_label_distributions.png
        formats: [ png, pdf ]

