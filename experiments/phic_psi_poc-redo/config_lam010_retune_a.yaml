# λ=0.10 retune — control for poc_redo_b's retune (config_lam010_retune_b.yaml).
#
# Same as config_lam005_retune_a.yaml but magnitude_penalty_lambda raised 0.05→0.10.
#
# Purpose: diagnostic_logvar_gate.py (2026-09-15, λ=0.05 round) found
# phic_psi_lam005_retune_a's std_ratio gate FAILS again at λ=0.05 for both
# coa_phase (frac_unhealthy=0.350, trend=-0.00561, final std_ratio=0.522) and
# polarization_angle (frac_unhealthy=0.425, trend=+0.00383, final std_ratio=0.572)
# — same std_ratio pathology as λ=0.01, not resolved by the 5x penalty increase.
# This config is retrained in parallel with config_lam010_retune_b.yaml as a
# REQUIRED CONTROL, not a primary test — see preregistration_lam_retune.md's
# Scope section: poc_redo_a's role is to stay a valid A/B comparison point at
# the same λ as poc_redo_b, not to prove anything about itself. Baseline mode
# doesn't build combo_A/combo_B at all (trainer.py's _baseline_total_loss),
# so it isn't touched by the 2φc±2ψ formula correction either way.

name: phic_psi_lam010_retune_a
run_dir: runs/phic_psi_lam010_retune_a

data:
  path: combined_repackaged.hdf
  batch_size: 128

model:
  trunk: tcn
  trunk_cfg: {}
  heads: [ mchirp, merger_time, snr, sky_position, coa_phase,
           polarization_angle, inclination ]
  head_cfg:
    hidden_units: 64
    bounded: true

loss:
  mode: baseline
  huber_delta: 1.0
  weighting: uncertainty
  snr_weight_alpha: null
  log_var_clamp: 3.0
  variance_penalty: 0.0
  # Radial regularisation for PERIODIC heads using circular loss.
  # The isotropic 1−cosΔθ loss is blind to |v_raw| — without this penalty
  # |v| drifts, and normalize_unit's backward pass (÷|v|) crushes or
  # explodes the angular gradient.
  magnitude_penalty_lambda: 0.10   # ← RETUNE: 10x the from-day-1 default 0.01, 2x the λ=0.05 attempt

optim:
  lr: 1.0e-3
  warmup_epochs: 0
  schedule:
    type: plateau
    factor: 0.5
    patience: 5
    min_lr: 1.0e-6

train:
  epochs: 80
  seed: 42
  deterministic_ops: false
  diagnostics_every_n: 5
  checkpoint_every_n: 10
  scatter_subset: 1000
  early_stopping: false
  verbose: 2
